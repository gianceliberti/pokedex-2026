<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- La página soporta claro y oscuro: evita que el navegador invierta los colores a lo bruto -->
    <meta name="color-scheme" content="light dark">
    <title>Pokémon App</title>
    <!-- Bootstrap primero para que nuestros estilos (styles.css) puedan sobrescribirlo -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles/styles.css">
    
</head>
<body>
<div>
    <div>
        <h1>Pokémon Information</h1>
    </div>
    <div class="container">
        <!-- Nueva entrada para el nombre del Pokémon -->
        <div class="form-group">
            <label for="pokemonName">Search Pokémon by Name:</label>
            <div class="autocomplete-wrapper">
                <input type="text" class="form-control" id="pokemonName" autocomplete="off">
                <div id="autocompleteList" class="autocomplete-list"></div>
            </div>
        </div>
        
        <button id="searchByName" class="btn btn-primary">Search</button>
        <button id="galleryToggle" type="button">🗺️ Explorar Pokédex</button>

        <div id="errorMessage" style="color: red;"></div>
        <div id="gallery" class="gallery"></div>
        <div id="pokemonInfo"></div>
    </div>
    

    <!-- Importa scripts -->
    <script src="js/script.js"></script>
    <script src="js/eventListeners.js"></script>
    <script src="js/gallery.js"></script>

    <!-- Agrega el enlace a Bootstrap JS y Popper.js al final del cuerpo del documento 
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>-->
</div>
</body>
</html>
